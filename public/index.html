<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<title>curl runner</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f9cf9;
    --ok: #3fb950; --err: #f85149; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--border); min-height: 0; }
  .col { background: var(--bg); display: flex; flex-direction: column;
    min-height: 0; overflow: auto; }
  .field { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  label { display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  textarea, input[type=text], input[type=number] {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: var(--mono); font-size: 13px; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  /* Auto-grow: JS sets height to fit content, between these bounds. */
  #curl { min-height: 160px; max-height: 60vh; overflow-y: auto; }
  #vars { min-height: 120px; max-height: 50vh; overflow-y: auto; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .row .field { flex: 1; border-bottom: none; padding: 0; }
  .controls { padding: 14px 18px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border); }
  button { font-size: 14px; font-weight: 600; padding: 9px 20px; border-radius: 6px;
    border: none; cursor: pointer; }
  #start { background: var(--accent); color: #fff; }
  #dry { background: var(--panel); color: var(--accent); border: 1px solid var(--border); }
  #stop { background: var(--panel); color: var(--err); border: 1px solid var(--err); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .checkbox { display: flex; align-items: center; gap: 6px; color: var(--muted);
    font-size: 13px; cursor: pointer; }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); font-family: var(--mono); }
  #output { flex: 1; margin: 0; padding: 14px 18px; overflow: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .run { border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin-bottom: 12px; }
  .run.ok { border-left-color: var(--ok); }
  .run.err { border-left-color: var(--err); }
  .run .meta { color: var(--muted); margin-bottom: 4px; }
  .run .meta .code { color: var(--text); font-weight: 600; }
  .run .meta .code.ok { color: var(--ok); }
  .run .meta .code.err { color: var(--err); }
  .run pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #cfd6e4; }
  /* "raw" toggle: swap the pretty response for request + raw response */
  .run .raw { display: none; color: #aeb6c6; }
  #output.show-raw .run .pretty { display: none; }
  #output.show-raw .run .raw { display: block; }
  #raw.on { color: var(--accent); border-color: var(--accent); }
  /* Output filter: narrow the pane to a status group or a single code */
  #filter { background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
  #filter:focus { outline: none; border-color: var(--accent); }
  /* Highlighted whenever a filter is active, so a short pane never looks like a short run */
  #filter.on { color: var(--accent); border-color: var(--accent); }
  #emptyFilter { color: var(--muted); font-family: var(--mono); font-size: 12.5px; padding: 4px 0 4px 10px; }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  /* Shared-variable chips */
  #globalsBar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px;
    font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip .k { color: var(--accent); }
  .chip .v { color: var(--muted); }
  .chip .exp { color: var(--muted); font-size: 11px; border-left: 1px solid var(--border); padding-left: 8px; margin-left: 2px; }
  .chip.expired .k { color: var(--err); }
  .chip.expired .exp { color: var(--err); }
  #addGlobal { background: transparent; border: 1px dashed var(--border); color: var(--muted);
    border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 500; }
  #addGlobal:hover { border-color: var(--accent); color: var(--accent); }
  #globalEditor { margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  #globalEditor input, #globalEditor textarea { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: 13px; }
  #globalEditor button { padding: 7px 12px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  #gSave { color: var(--accent); border-color: var(--accent); }
  #gDelete { color: var(--err); border-color: var(--err); }
  #tooltip { position: fixed; z-index: 50; max-width: 460px; max-height: 220px; overflow: hidden;
    background: #0b0d12; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text); word-break: break-all;
    white-space: pre-wrap; box-shadow: 0 6px 20px rgba(0,0,0,.55); pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>curl runner</h1>
    <span>paste a curl, fill in {{variables}}, run it once or N times</span>
    <button type="button" id="reset" style="margin-left:auto; align-self:center; padding:5px 14px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); border-radius:6px; cursor:pointer;">↺ reset all</button>
  </header>
  <div class="main">
    <div class="col">
      <div class="field" id="globalsField">
        <label style="display:flex; align-items:center; gap:10px;">
          <span>variables</span>
          <span style="text-transform:none; letter-spacing:normal; color:var(--muted); font-size:11px; font-weight:400;">shared across every run · hover to reveal, click to edit</span>
        </label>
        <div id="globalsBar">
          <button type="button" id="addGlobal">+ add</button>
        </div>
        <div id="globalEditor" style="display:none;">
          <input type="text" id="gName" placeholder="name" style="max-width:160px;" />
          <textarea id="gValue" placeholder="value" rows="1" style="flex:1; min-width:220px; min-height:36px;"></textarea>
          <button type="button" id="gSave">save</button>
          <button type="button" id="gDelete">delete</button>
          <button type="button" id="gCancel">cancel</button>
        </div>
      </div>
      <div class="field">
        <label for="curl" style="display:flex; align-items:center; gap:10px;">
          <span>curl command</span>
          <button type="button" id="analyze" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--accent); border:1px solid var(--accent); text-transform:none; letter-spacing:normal; font-weight:600;">✦ analyze</button>
          <span id="curlNote" style="font-size:11px; color:var(--muted); text-transform:none; letter-spacing:normal;"></span>
        </label>
        <textarea id="curl" spellcheck="false" placeholder="curl -X POST https://api.example.com/items/{{id}} \
  -H 'Authorization: Bearer {{token}}' \
  -H 'Content-Type: application/json' \
  -d '{&quot;name&quot;: &quot;{{name}}&quot;}'"></textarea>
        <div class="note">Use <code>{{name}}</code> anywhere — URL, headers, or body.</div>
      </div>
      <div class="field">
        <label for="vars" style="display:flex; align-items:center; gap:10px;">
          <span>data (JSON)</span>
          <button type="button" id="prettify" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); text-transform:none; letter-spacing:normal; font-weight:500;">✦ prettify</button>
          <button type="button" id="upload" style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); text-transform:none; letter-spacing:normal; font-weight:500;">⤓ upload .json / .csv</button>
          <span id="fileName" style="font-size:11px; color:var(--muted); text-transform:none; letter-spacing:normal;"></span>
        </label>
        <input type="file" id="fileInput" accept=".json,application/json,.csv,text/csv" style="display:none;" />
        <textarea id="vars" spellcheck="false" placeholder='{ "id": "123", "token": "abc", "name": "Widget" }'></textarea>
        <div class="note">Merged with the shared variables above (these win on a name clash). Empty or an object = one run; array of objects = one run per element.</div>
      </div>
      <div class="controls">
        <div class="field" style="max-width:120px; padding:0;">
          <label for="delay">delay (ms)</label>
          <input type="number" id="delay" value="50" min="0" step="10" />
        </div>
        <div class="field" id="runsField" style="max-width:100px; padding:0;">
          <label for="runs">runs</label>
          <input type="number" id="runs" value="1" min="1" step="1" />
        </div>
        <span id="runsNote" style="font-size:12px; color:var(--muted); align-self:flex-end; padding-bottom:10px;"></span>
      </div>
      <div class="controls">
        <button id="start">▶ Start</button>
        <button id="dry">⌁ Dry run</button>
        <button id="stop" disabled>■ Stop</button>
        <span class="status" id="statusLine">idle</span>
      </div>
    </div>
    <div class="col">
      <div class="field" style="border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px;">
        <label style="margin:0;">output</label>
        <select id="filter" title="filter the output by status"><option value="all">all (0)</option></select>
        <button id="raw" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">&lt;/&gt; raw</button>
        <button id="download" disabled style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">⤓ results</button>
        <button id="clear" style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">clear</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
