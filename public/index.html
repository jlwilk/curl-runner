<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>curl runner</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f9cf9;
    --ok: #3fb950; --err: #f85149; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--border); min-height: 0; }
  .col { background: var(--bg); display: flex; flex-direction: column;
    min-height: 0; overflow: auto; }
  .field { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  label { display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  textarea, input[type=text], input[type=number] {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: var(--mono); font-size: 13px; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  /* Auto-grow: JS sets height to fit content, between these bounds. */
  #curl { min-height: 160px; max-height: 60vh; overflow-y: auto; }
  #vars { min-height: 120px; max-height: 50vh; overflow-y: auto; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .row .field { flex: 1; border-bottom: none; padding: 0; }
  .controls { padding: 14px 18px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border); }
  button { font-size: 14px; font-weight: 600; padding: 9px 20px; border-radius: 6px;
    border: none; cursor: pointer; }
  #start { background: var(--accent); color: #fff; }
  #dry { background: var(--panel); color: var(--accent); border: 1px solid var(--border); }
  #stop { background: var(--panel); color: var(--err); border: 1px solid var(--err); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .checkbox { display: flex; align-items: center; gap: 6px; color: var(--muted);
    font-size: 13px; cursor: pointer; }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); font-family: var(--mono); }
  #output { flex: 1; margin: 0; padding: 14px 18px; overflow: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .run { border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin-bottom: 12px; }
  .run.ok { border-left-color: var(--ok); }
  .run.err { border-left-color: var(--err); }
  .run .meta { color: var(--muted); margin-bottom: 4px; }
  .run .meta .code { color: var(--text); font-weight: 600; }
  .run .meta .code.ok { color: var(--ok); }
  .run .meta .code.err { color: var(--err); }
  .run pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #cfd6e4; }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
  <header>
    <h1>curl runner</h1>
    <span>paste a curl, fill in {{variables}}, run it on a loop</span>
  </header>
  <div class="main">
    <div class="col">
      <div class="field">
        <label for="curl" style="display:flex; align-items:center; gap:10px;">
          <span>curl command</span>
          <button type="button" id="analyze" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--accent); border:1px solid var(--accent); text-transform:none; letter-spacing:normal; font-weight:600;">✦ analyze</button>
          <span id="curlNote" style="font-size:11px; color:var(--muted); text-transform:none; letter-spacing:normal;"></span>
        </label>
        <textarea id="curl" spellcheck="false" placeholder="curl -X POST https://api.example.com/items/{{id}} \
  -H 'Authorization: Bearer {{token}}' \
  -H 'Content-Type: application/json' \
  -d '{&quot;name&quot;: &quot;{{name}}&quot;}'"></textarea>
        <div class="note">Use <code>{{name}}</code> anywhere — URL, headers, or body.</div>
      </div>
      <div class="field">
        <label for="vars" style="display:flex; align-items:center; gap:10px;">
          <span>variables (JSON)</span>
          <button type="button" id="prettify" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); text-transform:none; letter-spacing:normal; font-weight:500;">✦ prettify</button>
          <button type="button" id="upload" style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); text-transform:none; letter-spacing:normal; font-weight:500;">⤓ upload .json / .csv</button>
          <span id="fileName" style="font-size:11px; color:var(--muted); text-transform:none; letter-spacing:normal;"></span>
        </label>
        <input type="file" id="fileInput" accept=".json,application/json,.csv,text/csv" style="display:none;" />
        <textarea id="vars" spellcheck="false" placeholder='{ "id": "123", "token": "abc", "name": "Widget" }'></textarea>
        <div class="note">Object = repeat the same request. Array of objects = one run per element.</div>
      </div>
      <div class="controls">
        <div class="row" style="flex:0 0 auto;">
          <div class="field" style="max-width:140px;">
            <label for="delay">delay (ms)</label>
            <input type="number" id="delay" value="1000" min="0" step="100" />
          </div>
        </div>
        <label class="checkbox"><input type="checkbox" id="repeat" /> loop forever</label>
      </div>
      <div class="controls">
        <button id="start">▶ Start</button>
        <button id="dry">⌁ Dry run</button>
        <button id="stop" disabled>■ Stop</button>
        <span class="status" id="statusLine">idle</span>
      </div>
    </div>
    <div class="col">
      <div class="field" style="border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px;">
        <label style="margin:0;">output</label>
        <button id="download" disabled style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">⤓ results</button>
        <button id="clear" style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">clear</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let controller = null;

// Grow a textarea to fit its content (CSS max-height caps it, then it scrolls).
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
// Live-resize the two input boxes as you type or paste.
["curl", "vars"].forEach((id) => {
  const el = $(id);
  el.addEventListener("input", () => autoGrow(el));
});

function setRunning(running) {
  $("start").disabled = running;
  $("stop").disabled = !running;
}

function addRun({ run, status, ok, ms, method, url, body, error }) {
  const div = document.createElement("div");
  div.className = "run " + (ok ? "ok" : "err");
  const codeClass = ok ? "ok" : "err";
  const display = error ? `ERR ${error}` : status;
  div.innerHTML =
    `<div class="meta">#${run} <span class="code ${codeClass}">${display}</span> ` +
    `· ${ms}ms · ${method} ${escapeHtml(url)}</div>`;
  if (body) {
    const pre = document.createElement("pre");
    pre.textContent = pretty(body);
    div.appendChild(pre);
  }
  const out = $("output");
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function pretty(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2); }
  catch { return text; }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function note(msg, isError) {
  const div = document.createElement("div");
  div.className = "run" + (isError ? " err" : "");
  div.innerHTML = `<div class="meta">${escapeHtml(msg)}</div>`;
  $("output").appendChild(div);
}

let runResults = [];
function runSummary() {
  const ok = runResults.filter((r) => r.ok).length;
  return `${ok} ok · ${runResults.length - ok} failed`;
}

// Non-blocking warning if a variable is an already-expired JWT (would 401).
function preflightTokenWarnings(varsText) {
  let parsed;
  try { parsed = varsText.trim() ? JSON.parse(varsText) : {}; } catch { return []; }
  const sets = Array.isArray(parsed) ? parsed : [parsed];
  const seen = new Set(), warns = [];
  for (const set of sets) {
    if (!set || typeof set !== "object") continue;
    for (const [k, val] of Object.entries(set)) {
      if (typeof val !== "string" || val.split(".").length !== 3 || seen.has(val)) continue;
      seen.add(val);
      const claims = decodeJwt(val);
      if (claims?.exp) {
        const e = fmtExpiry(claims.exp);
        if (e.expired) warns.push(`⚠ variable "${k}" is an expired JWT — ${e.text}`);
      }
    }
  }
  return warns;
}

// Render a dry-run entry: the request that *would* be sent.
function renderDry(msg) {
  const div = document.createElement("div");
  div.className = "run";
  div.style.borderLeftColor = "var(--accent)";
  const hdrs = Object.entries(msg.headers || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
  div.innerHTML = `<div class="meta">#${msg.run} <span class="code">DRY</span> · ${msg.method} ${escapeHtml(msg.url)}</div>`;
  const pre = document.createElement("pre");
  pre.textContent = (hdrs ? hdrs + "\n" : "") + (msg.body ? "\n" + pretty(msg.body) : "");
  div.appendChild(pre);
  $("output").appendChild(div);
  $("output").scrollTop = $("output").scrollHeight;
}

async function start(dryRun = false) {
  setRunning(true);
  runResults = [];
  $("download").disabled = true;
  $("statusLine").textContent = dryRun ? "previewing…" : "running…";
  if (!dryRun) preflightTokenWarnings($("vars").value).forEach((w) => note(w, true));
  controller = new AbortController();
  let dryCount = 0;
  try {
    const resp = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        curl: $("curl").value,
        vars: $("vars").value,
        delayMs: Number($("delay").value),
        repeat: $("repeat").checked,
        dryRun,
      }),
    });
    // Read the NDJSON stream line by line.
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) !== -1) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.type === "result") {
          addRun(msg);
          runResults.push({ run: msg.run, method: msg.method, url: msg.url, status: msg.status, ok: msg.ok, ms: msg.ms, error: msg.error || "", response: msg.body || "" });
        } else if (msg.type === "dry") { renderDry(msg); dryCount++; }
        else if (msg.type === "start") note(`${dryRun ? "⌁ dry run" : "▶"} ${msg.method} ${msg.url} — ${msg.sets} set(s)${msg.repeat && !dryRun ? ", looping" : ""}`);
        else if (msg.type === "done") note(dryRun ? `✓ dry run — ${dryCount} request(s) previewed` : `✓ done — ${runSummary()}`);
        else if (msg.type === "error") note(msg.message, true);
      }
    }
    $("statusLine").textContent = dryRun ? `dry run · ${dryCount} request(s)` : `done · ${runSummary()}`;
  } catch (e) {
    if (e.name === "AbortError") $("statusLine").textContent = `stopped · ${runSummary()}`;
    else { note(`Request failed: ${e.message}`, true); $("statusLine").textContent = "error"; }
  } finally {
    setRunning(false);
    controller = null;
    $("download").disabled = runResults.length === 0;
  }
}

// Export the last run's results as CSV.
function downloadResults() {
  if (!runResults.length) return;
  const cols = ["run", "method", "url", "status", "ok", "ms", "error", "response"];
  const esc = (s) => { s = s == null ? "" : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.join(","), ...runResults.map((r) => cols.map((c) => esc(r[c])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "curl-runner-results.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- analyze: templatize a pasted curl ------------------------------------

function setCurlNote(text, isError) {
  const el = $("curlNote");
  el.textContent = text;
  el.style.color = isError ? "var(--err)" : "var(--muted)";
}

// Tokenize a curl into { value, start, end } spans over the raw text, so we can
// splice exact substrings later. Handles '...', "...", \-escapes, line
// continuations, and bash ANSI-C $'...' quoting (Chrome's "Copy as cURL").
function ansiEscape(ch) {
  return { n: "\n", t: "\t", r: "\r", "\\": "\\", "'": "'", '"': '"' }[ch] ?? ch;
}
function tokenizeSpans(input) {
  const tokens = [];
  let cur = "", quote = null, ansiC = false, start = -1, has = false;
  const begin = (i) => { if (start < 0) start = i; has = true; };
  for (let i = 0; i < input.length; i++) {
    const c = input[i];
    if (quote) {
      if (quote === "'" && ansiC) {
        if (c === "\\") { cur += ansiEscape(input[++i]); }
        else if (c === "'") { quote = null; ansiC = false; }
        else cur += c;
      } else if (c === quote) {
        quote = null;
      } else if (c === "\\" && quote === '"') {
        cur += input[++i] ?? "";
      } else cur += c;
      continue;
    }
    if (c === "$" && input[i + 1] === "'") { begin(i); quote = "'"; ansiC = true; i++; }
    else if (c === "'" || c === '"') { begin(i); quote = c; }
    else if (c === "\\") {
      const n = input[i + 1];
      if (n === "\n" || n === "\r") i++;
      else if (n !== undefined) { begin(i); cur += n; i++; }
    } else if (/\s/.test(c)) {
      if (has) { tokens.push({ value: cur, start, end: i }); cur = ""; has = false; start = -1; }
    } else { begin(i); cur += c; }
  }
  if (has) tokens.push({ value: cur, start, end: input.length });
  return tokens;
}

function decodeJwt(tok) {
  const parts = tok.split(".");
  if (parts.length < 2) return null;
  let p = parts[1].replace(/-/g, "+").replace(/_/g, "/");
  while (p.length % 4) p += "=";
  try { return JSON.parse(atob(p)); } catch { return null; }
}
function fmtExpiry(exp) {
  const ms = exp * 1000 - Date.now();
  const mins = Math.round(Math.abs(ms) / 60000);
  const dur = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
  const at = new Date(exp * 1000).toLocaleTimeString();
  return ms >= 0 ? { text: `expires in ${dur} (≈ ${at})`, expired: false }
                 : { text: `EXPIRED ${dur} ago (≈ ${at})`, expired: true };
}

function analyzeCurl() {
  const text = $("curl").value;
  if (!text.trim()) { setCurlNote("paste a curl first", true); return; }
  const tokens = tokenizeSpans(text);
  const vars = {};
  const repls = [];        // { start, end, text } splices, applied right-to-left
  let tokenInfo = "", expired = false;
  let nUrl = 0, nBody = 0;

  const DATA_FLAGS = new Set(["-d", "--data", "--data-raw", "--data-binary", "--data-ascii"]);

  for (let i = 0; i < tokens.length; i++) {
    const v = tokens[i].value;

    // Authorization header: pull the Bearer JWT into {{token}}.
    if ((v === "-H" || v === "--header") && tokens[i + 1]) {
      const h = tokens[++i];
      const m = /^(authorization:\s*bearer\s+)(\S+)/i.exec(h.value);
      if (m) {
        vars.token = m[2];
        repls.push({ start: h.start, end: h.end, text: `'${h.value.replace(m[2], "{{token}}")}'` });
        const claims = decodeJwt(m[2]);
        if (claims?.exp) {
          const e = fmtExpiry(claims.exp);
          expired = e.expired;
          tokenInfo = `token → {{token}} · ${e.text}${claims.sub ? ` · ${claims.sub}` : ""}`;
        } else {
          tokenInfo = "token → {{token}}";
        }
      }
      continue;
    }

    // Data/body: turn each top-level JSON field into a {{var}}.
    if (DATA_FLAGS.has(v) && tokens[i + 1]) {
      const d = tokens[++i];
      try {
        const parsed = JSON.parse(d.value);
        if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
          const fields = Object.entries(parsed).map(([k, val]) => {
            if (val === null || typeof val === "object") return `${JSON.stringify(k)}:${JSON.stringify(val)}`;
            vars[k] = val; nBody++;
            return `${JSON.stringify(k)}:${typeof val === "string" ? `"{{${k}}}"` : `{{${k}}}`}`;
          });
          repls.push({ start: d.start, end: d.end, text: `'{${fields.join(",")}}'` });
        }
      } catch { /* not JSON — leave the body as-is */ }
      continue;
    }

    // Bare URL token: turn query-string values into {{var}}s.
    if (!v.startsWith("-") && i > 0 && /^https?:\/\//i.test(v)) {
      const q = v.indexOf("?");
      if (q !== -1) {
        const base = v.slice(0, q);
        const pairs = v.slice(q + 1).split("&").map((pair) => {
          const eq = pair.indexOf("=");
          if (eq === -1) return pair;
          const key = pair.slice(0, eq);
          vars[key] = decodeURIComponent(pair.slice(eq + 1)); nUrl++;
          return `${key}={{${key}}}`;
        });
        repls.push({ start: tokens[i].start, end: tokens[i].end, text: `'${base}?${pairs.join("&")}'` });
      }
    }
  }

  if (!repls.length) {
    setCurlNote("nothing to templatize — no bearer token, query params, or JSON body found", true);
    return;
  }

  // Apply splices right-to-left so earlier spans stay valid.
  repls.sort((a, b) => b.start - a.start);
  let out = text;
  for (const r of repls) out = out.slice(0, r.start) + r.text + out.slice(r.end);
  $("curl").value = out;
  autoGrow($("curl"));

  // Seed the variables box with the discovered example values.
  $("vars").value = JSON.stringify(vars, null, 2);
  const counts = [nUrl && `${nUrl} url var(s)`, nBody && `${nBody} body field(s)`].filter(Boolean).join(", ");
  setVarsNote(`analyzed${counts ? ` · ${counts}` : ""}`);
  setCurlNote(tokenInfo || "templatized", expired);
}
$("analyze").addEventListener("click", analyzeCurl);

$("start").addEventListener("click", () => start(false));
$("dry").addEventListener("click", () => start(true));
$("stop").addEventListener("click", () => controller && controller.abort());
$("clear").addEventListener("click", () => ($("output").innerHTML = ""));
$("download").addEventListener("click", downloadResults);

// Persist inputs across refreshes so a reload never wipes a pasted curl.
const LS = { curl: "cr.curl", vars: "cr.vars", delay: "cr.delay", repeat: "cr.repeat" };
function saveState() {
  try {
    localStorage.setItem(LS.curl, $("curl").value);
    localStorage.setItem(LS.vars, $("vars").value);
    localStorage.setItem(LS.delay, $("delay").value);
    localStorage.setItem(LS.repeat, $("repeat").checked ? "1" : "");
  } catch { /* storage unavailable — ignore */ }
}
function restoreState() {
  try {
    const c = localStorage.getItem(LS.curl); if (c !== null) $("curl").value = c;
    const v = localStorage.getItem(LS.vars); if (v !== null) $("vars").value = v;
    const d = localStorage.getItem(LS.delay); if (d) $("delay").value = d;
    $("repeat").checked = !!localStorage.getItem(LS.repeat);
    autoGrow($("curl")); autoGrow($("vars"));
  } catch { /* ignore */ }
}
["curl", "vars", "delay"].forEach((id) => $(id).addEventListener("input", saveState));
$("repeat").addEventListener("change", saveState);
restoreState();

// Parse CSV into rows of fields. Handles quoted fields, embedded commas and
// newlines, "" escapes, CRLF, and a leading BOM.
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1); // strip BOM
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } // escaped quote
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else if (c !== "\r") {
      field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  // Drop fully-blank rows (e.g. trailing newline).
  return rows.filter((r) => !(r.length === 1 && r[0].trim() === ""));
}

// CSV -> array of objects, header row as keys. Values stay strings (they get
// substituted into the curl as text anyway).
function csvToObjects(text) {
  const rows = parseCSV(text);
  if (rows.length < 1) return [];
  const headers = rows[0].map((h) => h.trim());
  return rows.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
    return obj;
  });
}

// Small status line next to the variables buttons (filename, item count,
// prettify result). isError tints it red.
function setVarsNote(text, isError) {
  const el = $("fileName");
  el.textContent = text;
  el.style.color = isError ? "var(--err)" : "var(--muted)";
  autoGrow($("vars")); // upload/prettify just changed the box — refit it
}

// Prettify (and gently repair) the variables box. Reformats valid JSON; if the
// text only parses once wrapped in [ ], wraps it for you; otherwise says so.
$("prettify").addEventListener("click", () => {
  const text = $("vars").value.trim();
  if (!text) { setVarsNote("nothing to format"); return; }
  try {
    const parsed = JSON.parse(text);
    $("vars").value = JSON.stringify(parsed, null, 2);
    setVarsNote(`formatted${Array.isArray(parsed) ? ` · ${parsed.length} items` : ""}`);
    return;
  } catch { /* try the missing-brackets case below */ }
  try {
    const wrapped = JSON.parse(`[${text}]`);
    $("vars").value = JSON.stringify(wrapped, null, 2);
    setVarsNote(`wrapped in [ ] and formatted · ${wrapped.length} items`);
  } catch {
    setVarsNote("✗ invalid JSON — can't format until it's fixed", true);
  }
});

// Load a .json or .csv file into the variables box. JSON is pretty-printed
// (raw on parse failure so the inline error can point at the problem); CSV is
// converted to an array of objects.
$("upload").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    let note = "";
    if (/\.csv$/i.test(file.name)) {
      const objs = csvToObjects(text);
      $("vars").value = JSON.stringify(objs, null, 2);
      note = ` · ${objs.length} items`;
    } else {
      try { $("vars").value = JSON.stringify(JSON.parse(text), null, 2); }
      catch { $("vars").value = text; }
      try { const p = JSON.parse($("vars").value); if (Array.isArray(p)) note = ` · ${p.length} items`; }
      catch { /* leave note empty */ }
    }
    setVarsNote(`${file.name}${note}`);
  };
  reader.readAsText(file);
  e.target.value = ""; // allow re-uploading the same file
});
</script>
</body>
</html>
