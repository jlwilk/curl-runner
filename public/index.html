<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>curl runner</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f9cf9;
    --ok: #3fb950; --err: #f85149; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--border); min-height: 0; }
  .col { background: var(--bg); display: flex; flex-direction: column;
    min-height: 0; overflow: auto; }
  .field { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  label { display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  textarea, input[type=text], input[type=number] {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: var(--mono); font-size: 13px; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  /* Auto-grow: JS sets height to fit content, between these bounds. */
  #curl { min-height: 160px; max-height: 60vh; overflow-y: auto; }
  #vars { min-height: 120px; max-height: 50vh; overflow-y: auto; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .row .field { flex: 1; border-bottom: none; padding: 0; }
  .controls { padding: 14px 18px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border); }
  button { font-size: 14px; font-weight: 600; padding: 9px 20px; border-radius: 6px;
    border: none; cursor: pointer; }
  #start { background: var(--accent); color: #fff; }
  #dry { background: var(--panel); color: var(--accent); border: 1px solid var(--border); }
  #stop { background: var(--panel); color: var(--err); border: 1px solid var(--err); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .checkbox { display: flex; align-items: center; gap: 6px; color: var(--muted);
    font-size: 13px; cursor: pointer; }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); font-family: var(--mono); }
  #output { flex: 1; margin: 0; padding: 14px 18px; overflow: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .run { border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin-bottom: 12px; }
  .run.ok { border-left-color: var(--ok); }
  .run.err { border-left-color: var(--err); }
  .run .meta { color: var(--muted); margin-bottom: 4px; }
  .run .meta .code { color: var(--text); font-weight: 600; }
  .run .meta .code.ok { color: var(--ok); }
  .run .meta .code.err { color: var(--err); }
  .run pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #cfd6e4; }
  /* "raw" toggle: swap the pretty response for request + raw response */
  .run .raw { display: none; color: #aeb6c6; }
  #output.show-raw .run .pretty { display: none; }
  #output.show-raw .run .raw { display: block; }
  #raw.on { color: var(--accent); border-color: var(--accent); }
  .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  /* Shared-variable chips */
  #globalsBar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px;
    font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip .k { color: var(--accent); }
  .chip .v { color: var(--muted); }
  .chip .exp { color: var(--muted); font-size: 11px; border-left: 1px solid var(--border); padding-left: 8px; margin-left: 2px; }
  .chip.expired .k { color: var(--err); }
  .chip.expired .exp { color: var(--err); }
  #addGlobal { background: transparent; border: 1px dashed var(--border); color: var(--muted);
    border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 500; }
  #addGlobal:hover { border-color: var(--accent); color: var(--accent); }
  #globalEditor { margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  #globalEditor input, #globalEditor textarea { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: 13px; }
  #globalEditor button { padding: 7px 12px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  #gSave { color: var(--accent); border-color: var(--accent); }
  #gDelete { color: var(--err); border-color: var(--err); }
  #tooltip { position: fixed; z-index: 50; max-width: 460px; max-height: 220px; overflow: hidden;
    background: #0b0d12; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text); word-break: break-all;
    white-space: pre-wrap; box-shadow: 0 6px 20px rgba(0,0,0,.55); pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>curl runner</h1>
    <span>paste a curl, fill in {{variables}}, run it on a loop</span>
  </header>
  <div class="main">
    <div class="col">
      <div class="field" id="globalsField">
        <label style="display:flex; align-items:center; gap:10px;">
          <span>variables</span>
          <span style="text-transform:none; letter-spacing:normal; color:var(--muted); font-size:11px; font-weight:400;">shared across every run · hover to reveal, click to edit</span>
        </label>
        <div id="globalsBar">
          <button type="button" id="addGlobal">+ add</button>
        </div>
        <div id="globalEditor" style="display:none;">
          <input type="text" id="gName" placeholder="name" style="max-width:160px;" />
          <textarea id="gValue" placeholder="value" rows="1" style="flex:1; min-width:220px; min-height:36px;"></textarea>
          <button type="button" id="gSave">save</button>
          <button type="button" id="gDelete">delete</button>
          <button type="button" id="gCancel">cancel</button>
        </div>
      </div>
      <div class="field">
        <label for="curl" style="display:flex; align-items:center; gap:10px;">
          <span>curl command</span>
          <button type="button" id="analyze" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--accent); border:1px solid var(--accent); text-transform:none; letter-spacing:normal; font-weight:600;">✦ analyze</button>
          <span id="curlNote" style="font-size:11px; color:var(--muted); text-transform:none; letter-spacing:normal;"></span>
        </label>
        <textarea id="curl" spellcheck="false" placeholder="curl -X POST https://api.example.com/items/{{id}} \
  -H 'Authorization: Bearer {{token}}' \
  -H 'Content-Type: application/json' \
  -d '{&quot;name&quot;: &quot;{{name}}&quot;}'"></textarea>
        <div class="note">Use <code>{{name}}</code> anywhere — URL, headers, or body.</div>
      </div>
      <div class="field">
        <label for="vars" style="display:flex; align-items:center; gap:10px;">
          <span>data (JSON)</span>
          <button type="button" id="prettify" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); text-transform:none; letter-spacing:normal; font-weight:500;">✦ prettify</button>
          <button type="button" id="upload" style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border); text-transform:none; letter-spacing:normal; font-weight:500;">⤓ upload .json / .csv</button>
          <span id="fileName" style="font-size:11px; color:var(--muted); text-transform:none; letter-spacing:normal;"></span>
        </label>
        <input type="file" id="fileInput" accept=".json,application/json,.csv,text/csv" style="display:none;" />
        <textarea id="vars" spellcheck="false" placeholder='{ "id": "123", "token": "abc", "name": "Widget" }'></textarea>
        <div class="note">Merged with the shared variables above (these win on a name clash). Empty or an object = one run; array of objects = one run per element.</div>
      </div>
      <div class="controls">
        <div class="field" style="max-width:120px; padding:0;">
          <label for="delay">delay (ms)</label>
          <input type="number" id="delay" value="1000" min="0" step="100" />
        </div>
        <div class="field" id="runsField" style="max-width:100px; padding:0;">
          <label for="runs">runs</label>
          <input type="number" id="runs" value="1" min="1" step="1" />
        </div>
        <span id="runsNote" style="font-size:12px; color:var(--muted); align-self:flex-end; padding-bottom:10px;"></span>
      </div>
      <div class="controls">
        <button id="start">▶ Start</button>
        <button id="dry">⌁ Dry run</button>
        <button id="stop" disabled>■ Stop</button>
        <span class="status" id="statusLine">idle</span>
      </div>
    </div>
    <div class="col">
      <div class="field" style="border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px;">
        <label style="margin:0;">output</label>
        <button id="raw" style="margin-left:auto; padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">&lt;/&gt; raw</button>
        <button id="download" disabled style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">⤓ results</button>
        <button id="clear" style="padding:4px 12px; font-size:12px; background:var(--panel); color:var(--muted); border:1px solid var(--border);">clear</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let controller = null;

// Grow a textarea to fit its content (CSS max-height caps it, then it scrolls).
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
// Live-resize the two input boxes as you type or paste.
["curl", "vars"].forEach((id) => {
  const el = $(id);
  el.addEventListener("input", () => autoGrow(el));
});

function setRunning(running) {
  $("start").disabled = running;
  $("stop").disabled = !running;
}

// Reconstruct the curl that was actually sent (vars already substituted).
function reqToCurl(method, url, headers, body) {
  const lines = [`curl -X ${method} '${url}'`];
  for (const [k, v] of Object.entries(headers || {})) lines.push(`  -H '${k}: ${v}'`);
  if (body) lines.push(`  --data '${body}'`);
  return lines.join(" \\\n");
}

function addRun({ run, status, ok, ms, method, url, body, error, reqHeaders, reqBody }) {
  const div = document.createElement("div");
  div.className = "run " + (ok ? "ok" : "err");
  const codeClass = ok ? "ok" : "err";
  const display = error ? `ERR ${error}` : status;
  div.innerHTML =
    `<div class="meta">#${run} <span class="code ${codeClass}">${display}</span> ` +
    `· ${ms}ms · ${method} ${escapeHtml(url)}</div>`;
  // Pretty view (default).
  if (body) {
    const pre = document.createElement("pre");
    pre.className = "pretty";
    pre.textContent = pretty(body);
    div.appendChild(pre);
  }
  // Raw view (shown when the "raw" toggle is on): exact request + raw response.
  const raw = document.createElement("pre");
  raw.className = "raw";
  raw.textContent =
    `# request\n${reqToCurl(method, url, reqHeaders, reqBody)}\n\n` +
    `# response (raw)\n${error ? "ERR " + error : (body || "")}`;
  div.appendChild(raw);

  const out = $("output");
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function pretty(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2); }
  catch { return text; }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function note(msg, isError) {
  const div = document.createElement("div");
  div.className = "run" + (isError ? " err" : "");
  div.innerHTML = `<div class="meta">${escapeHtml(msg)}</div>`;
  $("output").appendChild(div);
}

let runResults = [];
function runSummary() {
  const ok = runResults.filter((r) => r.ok).length;
  return `${ok} ok · ${runResults.length - ok} failed`;
}

// Non-blocking warning if a variable is an already-expired JWT (would 401).
function preflightTokenWarnings(varsText) {
  let parsed;
  try { parsed = varsText.trim() ? JSON.parse(varsText) : {}; } catch { return []; }
  const sets = Array.isArray(parsed) ? parsed : [parsed];
  const seen = new Set(), warns = [];
  for (const set of sets) {
    if (!set || typeof set !== "object") continue;
    for (const [k, val] of Object.entries(set)) {
      if (typeof val !== "string" || val.split(".").length !== 3 || seen.has(val)) continue;
      seen.add(val);
      const claims = decodeJwt(val);
      if (claims?.exp) {
        const e = fmtExpiry(claims.exp);
        if (e.expired) warns.push(`⚠ variable "${k}" is an expired JWT — ${e.text}`);
      }
    }
  }
  return warns;
}

// Warn about {{placeholders}} in the curl that nothing provides — they'd be
// sent literally (and usually break the request, as the raw view reveals).
function unresolvedVarWarnings() {
  const names = new Set();
  const re = /\{\{\s*([\w.-]+)\s*\}\}/g;
  let m;
  while ((m = re.exec($("curl").value))) names.add(m[1]);
  if (!names.size) return [];
  const provided = new Set(Object.keys(globals));
  try {
    const parsed = JSON.parse($("vars").value.trim() || "{}");
    for (const s of (Array.isArray(parsed) ? parsed : [parsed])) {
      if (s && typeof s === "object") Object.keys(s).forEach((k) => provided.add(k));
    }
  } catch { /* invalid data JSON — handled by its own error path */ }
  const missing = [...names].filter((n) => !provided.has(n));
  return missing.length
    ? [`⚠ no value for ${missing.map((n) => `{{${n}}}`).join(", ")} — omitted from the request`]
    : [];
}

// Render a dry-run entry: the request that *would* be sent.
function renderDry(msg) {
  const div = document.createElement("div");
  div.className = "run";
  div.style.borderLeftColor = "var(--accent)";
  const hdrs = Object.entries(msg.headers || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
  div.innerHTML = `<div class="meta">#${msg.run} <span class="code">DRY</span> · ${msg.method} ${escapeHtml(msg.url)}</div>`;
  const pre = document.createElement("pre");
  pre.textContent = (hdrs ? hdrs + "\n" : "") + (msg.body ? "\n" + pretty(msg.body) : "");
  div.appendChild(pre);
  $("output").appendChild(div);
  $("output").scrollTop = $("output").scrollHeight;
}

async function start(dryRun = false) {
  setRunning(true);
  runResults = [];
  $("download").disabled = true;
  $("statusLine").textContent = dryRun ? "previewing…" : "running…";
  // Warn about undefined {{vars}} on both runs and previews; token-expiry only
  // matters for a real run.
  const warns = unresolvedVarWarnings();
  if (!dryRun) warns.push(...preflightTokenWarnings($("vars").value), ...globalsTokenWarnings());
  warns.forEach((w) => note(w, true));
  controller = new AbortController();
  let dryCount = 0;
  try {
    const resp = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        curl: $("curl").value,
        vars: $("vars").value,
        delayMs: Number($("delay").value),
        count: Number($("runs").value) || 1,
        dryRun,
        globals,
      }),
    });
    // Read the NDJSON stream line by line.
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) !== -1) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.type === "result") {
          addRun(msg);
          runResults.push({ run: msg.run, method: msg.method, url: msg.url, status: msg.status, ok: msg.ok, ms: msg.ms, error: msg.error || "", response: msg.body || "" });
        } else if (msg.type === "dry") { renderDry(msg); dryCount++; }
        else if (msg.type === "start") note(`${dryRun ? "⌁ dry run" : "▶"} ${msg.method} ${msg.url} — ${msg.runs} run(s)`);
        else if (msg.type === "done") note(dryRun ? `✓ dry run — ${dryCount} request(s) previewed` : `✓ done — ${runSummary()}`);
        else if (msg.type === "error") note(msg.message, true);
      }
    }
    $("statusLine").textContent = dryRun ? `dry run · ${dryCount} request(s)` : `done · ${runSummary()}`;
  } catch (e) {
    if (e.name === "AbortError") $("statusLine").textContent = `stopped · ${runSummary()}`;
    else { note(`Request failed: ${e.message}`, true); $("statusLine").textContent = "error"; }
  } finally {
    setRunning(false);
    controller = null;
    $("download").disabled = runResults.length === 0;
  }
}

// Export the last run's results as CSV.
function downloadResults() {
  if (!runResults.length) return;
  const cols = ["run", "method", "url", "status", "ok", "ms", "error", "response"];
  const esc = (s) => { s = s == null ? "" : String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.join(","), ...runResults.map((r) => cols.map((c) => esc(r[c])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "curl-runner-results.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- shared variables (globals) -------------------------------------------
let globals = {};

function looksLikeJwt(v) { return typeof v === "string" && v.split(".").length === 3; }
function chipPreview(v) {
  if (v === "" || v == null) return "(empty)";
  const s = String(v);
  return s.length > 16 ? s.slice(0, 14) + "…" : s;
}
// If a value is a JWT with an exp claim, return live countdown parts:
//   short ("27m" / "1h 4m" / "45s") for the chip, long for the tooltip.
function expiryParts(value) {
  if (!looksLikeJwt(value)) return null;
  const claims = decodeJwt(value);
  if (!claims?.exp) return null;
  const ms = claims.exp * 1000 - Date.now();
  const a = Math.abs(ms);
  const h = Math.floor(a / 3600000), m = Math.floor((a % 3600000) / 60000), s = Math.floor((a % 60000) / 1000);
  const short = h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
  const at = new Date(claims.exp * 1000).toLocaleTimeString();
  const expired = ms < 0;
  return { expired, short, long: expired ? `EXPIRED ${short} ago (≈ ${at})` : `expires in ${short} (≈ ${at})` };
}

let tipEl = null;
// Tooltip text for a global chip: name (+ live expiry) and the full value.
function chipTipText(key) {
  const v = globals[key];
  const p = expiryParts(v);
  return `${key}${p ? " · " + p.long : ""}\n${v}`;
}
function showChipTip(ev, key) {
  hideTip();
  tipEl = document.createElement("div");
  tipEl.id = "tooltip";
  tipEl.dataset.key = key; // lets the ticker refresh it while open
  tipEl.textContent = chipTipText(key);
  document.body.appendChild(tipEl);
  moveTip(ev);
}
function moveTip(ev) {
  if (!tipEl) return;
  const pad = 14;
  tipEl.style.left = Math.min(ev.clientX + pad, window.innerWidth - tipEl.offsetWidth - pad) + "px";
  tipEl.style.top = (ev.clientY + pad) + "px";
}
function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }

function renderGlobals() {
  const bar = $("globalsBar"), add = $("addGlobal");
  bar.querySelectorAll(".chip").forEach((c) => c.remove());
  for (const [k, v] of Object.entries(globals)) {
    const p = expiryParts(v);
    const chip = document.createElement("span");
    chip.className = "chip" + (p?.expired ? " expired" : "");
    chip.dataset.key = k; // lets the ticker find this chip
    chip.innerHTML = `<span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(chipPreview(v))}</span>`
      + (p ? `<span class="exp">${escapeHtml(p.short)}</span>` : "");
    chip.addEventListener("mouseenter", (e) => showChipTip(e, k));
    chip.addEventListener("mousemove", moveTip);
    chip.addEventListener("mouseleave", hideTip);
    chip.addEventListener("click", () => { hideTip(); openEditor(k); });
    bar.insertBefore(chip, add);
  }
}

// Tick the JWT countdowns once a second: update each chip's "27m" label (and
// expired state), and refresh an open tooltip — no full re-render, so hover
// and edit state are preserved.
function tickExpiries() {
  $("globalsBar").querySelectorAll(".chip").forEach((chip) => {
    const p = expiryParts(globals[chip.dataset.key]);
    const exp = chip.querySelector(".exp");
    if (p && exp) { exp.textContent = p.short; chip.classList.toggle("expired", p.expired); }
  });
  if (tipEl?.dataset.key) tipEl.textContent = chipTipText(tipEl.dataset.key);
}
setInterval(tickExpiries, 1000);

function openEditor(key) {
  $("globalEditor").style.display = "flex";
  $("gName").value = key || "";
  $("gValue").value = key ? globals[key] : "";
  $("gName").dataset.orig = key || "";
  $("gDelete").style.display = key ? "" : "none";
  (key ? $("gValue") : $("gName")).focus();
}
function closeEditor() {
  $("globalEditor").style.display = "none";
  $("gName").value = ""; $("gValue").value = ""; $("gName").dataset.orig = "";
}
$("addGlobal").addEventListener("click", () => openEditor(""));
$("gSave").addEventListener("click", () => {
  const name = $("gName").value.trim();
  if (!name) { $("gName").focus(); return; }
  const orig = $("gName").dataset.orig;
  if (orig && orig !== name) delete globals[orig];
  globals[name] = $("gValue").value;
  renderGlobals(); saveState(); closeEditor();
});
$("gDelete").addEventListener("click", () => {
  const orig = $("gName").dataset.orig;
  if (orig) delete globals[orig];
  renderGlobals(); saveState(); closeEditor();
});
$("gCancel").addEventListener("click", closeEditor);

// Warn about expired-JWT globals (companion to the data-box check).
function globalsTokenWarnings() {
  const warns = [];
  for (const [k, v] of Object.entries(globals)) {
    if (!looksLikeJwt(v)) continue;
    const claims = decodeJwt(v);
    if (claims?.exp && fmtExpiry(claims.exp).expired) {
      warns.push(`⚠ variable "${k}" is an expired JWT — ${fmtExpiry(claims.exp).text}`);
    }
  }
  return warns;
}

// --- analyze: templatize a pasted curl ------------------------------------

function setCurlNote(text, isError) {
  const el = $("curlNote");
  el.textContent = text;
  el.style.color = isError ? "var(--err)" : "var(--muted)";
}

// Tokenize a curl into { value, start, end } spans over the raw text, so we can
// splice exact substrings later. Handles '...', "...", \-escapes, line
// continuations, and bash ANSI-C $'...' quoting (Chrome's "Copy as cURL").
// Decode one bash ANSI-C ($'...') escape. `input[i]` is the char right after the
// backslash. Returns [decodedString, nextIndex]. Handles the simple escapes plus
// \xHH, \uHHHH, \UHHHHHHHH, and \nnn octal (Chrome emits \uHHHH for non-ASCII).
function ansiCEscape(input, i) {
  const c = input[i];
  const simple = { n: "\n", t: "\t", r: "\r", a: "\x07", b: "\b", e: "\x1b", f: "\f", v: "\v", "\\": "\\", "'": "'", '"': '"', "?": "?" };
  if (c in simple) return [simple[c], i + 1];
  let m;
  if (c === "x" && (m = /^[0-9A-Fa-f]{1,2}/.exec(input.slice(i + 1, i + 3)))) return [String.fromCharCode(parseInt(m[0], 16)), i + 1 + m[0].length];
  if (c === "u" && (m = /^[0-9A-Fa-f]{1,4}/.exec(input.slice(i + 1, i + 5)))) return [String.fromCodePoint(parseInt(m[0], 16)), i + 1 + m[0].length];
  if (c === "U" && (m = /^[0-9A-Fa-f]{1,8}/.exec(input.slice(i + 1, i + 9)))) return [String.fromCodePoint(parseInt(m[0], 16)), i + 1 + m[0].length];
  if (c >= "0" && c <= "7" && (m = /^[0-7]{1,3}/.exec(input.slice(i, i + 3)))) return [String.fromCharCode(parseInt(m[0], 8)), i + m[0].length];
  return [c, i + 1]; // unknown escape — keep the char literally
}
function tokenizeSpans(input) {
  const tokens = [];
  let cur = "", quote = null, ansiC = false, start = -1, has = false;
  const begin = (i) => { if (start < 0) start = i; has = true; };
  for (let i = 0; i < input.length; i++) {
    const c = input[i];
    if (quote) {
      if (quote === "'" && ansiC) {
        if (c === "\\") { const [dec, next] = ansiCEscape(input, i + 1); cur += dec; i = next - 1; }
        else if (c === "'") { quote = null; ansiC = false; }
        else cur += c;
      } else if (c === quote) {
        quote = null;
      } else if (c === "\\" && quote === '"') {
        cur += input[++i] ?? "";
      } else cur += c;
      continue;
    }
    if (c === "$" && input[i + 1] === "'") { begin(i); quote = "'"; ansiC = true; i++; }
    else if (c === "'" || c === '"') { begin(i); quote = c; }
    else if (c === "\\") {
      const n = input[i + 1];
      if (n === "\n" || n === "\r") i++;
      else if (n !== undefined) { begin(i); cur += n; i++; }
    } else if (/\s/.test(c)) {
      if (has) { tokens.push({ value: cur, start, end: i }); cur = ""; has = false; start = -1; }
    } else { begin(i); cur += c; }
  }
  if (has) tokens.push({ value: cur, start, end: input.length });
  return tokens;
}

function decodeJwt(tok) {
  const parts = tok.split(".");
  if (parts.length < 2) return null;
  let p = parts[1].replace(/-/g, "+").replace(/_/g, "/");
  while (p.length % 4) p += "=";
  try { return JSON.parse(atob(p)); } catch { return null; }
}
function fmtExpiry(exp) {
  const ms = exp * 1000 - Date.now();
  const mins = Math.round(Math.abs(ms) / 60000);
  const dur = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
  const at = new Date(exp * 1000).toLocaleTimeString();
  return ms >= 0 ? { text: `expires in ${dur} (≈ ${at})`, expired: false }
                 : { text: `EXPIRED ${dur} ago (≈ ${at})`, expired: true };
}

function analyzeCurl() {
  const text = $("curl").value;
  if (!text.trim()) { setCurlNote("paste a curl first", true); return; }
  const tokens = tokenizeSpans(text);
  const vars = {};
  const repls = [];        // { start, end, text } splices, applied right-to-left
  let tokenInfo = "", expired = false;
  let nUrl = 0, nBody = 0;

  const DATA_FLAGS = new Set(["-d", "--data", "--data-raw", "--data-binary", "--data-ascii"]);

  for (let i = 0; i < tokens.length; i++) {
    const v = tokens[i].value;

    // Authorization header: pull the Bearer JWT into {{token}}.
    if ((v === "-H" || v === "--header") && tokens[i + 1]) {
      const h = tokens[++i];
      const m = /^(authorization:\s*bearer\s+)(\S+)/i.exec(h.value);
      if (m) {
        globals.token = m[2]; // token lives in the shared-variables bar, not the data box
        repls.push({ start: h.start, end: h.end, text: `'${h.value.replace(m[2], "{{token}}")}'` });
        const claims = decodeJwt(m[2]);
        if (claims?.exp) {
          const e = fmtExpiry(claims.exp);
          expired = e.expired;
          tokenInfo = `token → {{token}} · ${e.text}${claims.sub ? ` · ${claims.sub}` : ""}`;
        } else {
          tokenInfo = "token → {{token}}";
        }
      }
      continue;
    }

    // Data/body: turn each top-level JSON field into a {{var}}.
    if (DATA_FLAGS.has(v) && tokens[i + 1]) {
      const d = tokens[++i];
      try {
        const parsed = JSON.parse(d.value);
        if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
          const fields = Object.entries(parsed).map(([k, val]) => {
            if (val === null || typeof val === "object") return `${JSON.stringify(k)}:${JSON.stringify(val)}`;
            vars[k] = val; nBody++;
            return `${JSON.stringify(k)}:${typeof val === "string" ? `"{{${k}}}"` : `{{${k}}}`}`;
          });
          repls.push({ start: d.start, end: d.end, text: `'{${fields.join(",")}}'` });
        }
      } catch { /* not JSON — leave the body as-is */ }
      continue;
    }

    // Bare URL token: turn query-string values into {{var}}s.
    if (!v.startsWith("-") && i > 0 && /^https?:\/\//i.test(v)) {
      const q = v.indexOf("?");
      if (q !== -1) {
        const base = v.slice(0, q);
        const pairs = v.slice(q + 1).split("&").map((pair) => {
          const eq = pair.indexOf("=");
          if (eq === -1) return pair;
          const key = pair.slice(0, eq);
          const rawVal = pair.slice(eq + 1);
          // Leave empty/optional params as-is — nothing to templatize, and
          // turning them into a {{var}} just creates an undefined-value footgun.
          if (rawVal === "") return pair;
          vars[key] = decodeURIComponent(rawVal); nUrl++;
          return `${key}={{${key}}}`;
        });
        repls.push({ start: tokens[i].start, end: tokens[i].end, text: `'${base}?${pairs.join("&")}'` });
      }
    }
  }

  if (!repls.length) {
    setCurlNote("nothing to templatize — no bearer token, query params, or JSON body found", true);
    return;
  }

  // Apply splices right-to-left so earlier spans stay valid.
  repls.sort((a, b) => b.start - a.start);
  let out = text;
  for (const r of repls) out = out.slice(0, r.start) + r.text + out.slice(r.end);
  $("curl").value = out;
  autoGrow($("curl"));

  // Seed the variables box with the discovered example values.
  $("vars").value = JSON.stringify(vars, null, 2);
  const counts = [nUrl && `${nUrl} url var(s)`, nBody && `${nBody} body field(s)`].filter(Boolean).join(", ");
  setVarsNote(`analyzed${counts ? ` · ${counts}` : ""}`);
  setCurlNote(tokenInfo || "templatized", expired);
  renderGlobals();
  saveState();
}
$("analyze").addEventListener("click", analyzeCurl);

$("start").addEventListener("click", () => start(false));
$("dry").addEventListener("click", () => start(true));
$("stop").addEventListener("click", () => controller && controller.abort());
$("clear").addEventListener("click", () => ($("output").innerHTML = ""));
$("download").addEventListener("click", downloadResults);
$("raw").addEventListener("click", () => {
  const on = $("output").classList.toggle("show-raw");
  $("raw").classList.toggle("on", on);
  saveState();
});

// Persist inputs across refreshes so a reload never wipes a pasted curl.
const LS = { curl: "cr.curl", vars: "cr.vars", delay: "cr.delay", runs: "cr.runs", globals: "cr.globals", raw: "cr.raw" };
function saveState() {
  try {
    localStorage.setItem(LS.curl, $("curl").value);
    localStorage.setItem(LS.vars, $("vars").value);
    localStorage.setItem(LS.delay, $("delay").value);
    localStorage.setItem(LS.runs, $("runs").value);
    localStorage.setItem(LS.globals, JSON.stringify(globals));
    localStorage.setItem(LS.raw, $("output").classList.contains("show-raw") ? "1" : "");
  } catch { /* storage unavailable — ignore */ }
}
function restoreState() {
  try {
    const c = localStorage.getItem(LS.curl); if (c !== null) $("curl").value = c;
    const v = localStorage.getItem(LS.vars); if (v !== null) $("vars").value = v;
    const d = localStorage.getItem(LS.delay); if (d) $("delay").value = d;
    const r = localStorage.getItem(LS.runs); if (r) $("runs").value = r;
    try { globals = JSON.parse(localStorage.getItem(LS.globals) || "{}"); } catch { globals = {}; }
    if (localStorage.getItem(LS.raw)) { $("output").classList.add("show-raw"); $("raw").classList.add("on"); }
    renderGlobals();
    autoGrow($("curl")); autoGrow($("vars"));
    updateRunsVisibility();
  } catch { /* ignore */ }
}
["curl", "vars", "delay", "runs"].forEach((id) => $(id).addEventListener("input", saveState));
$("vars").addEventListener("input", updateRunsVisibility);
restoreState();

// Parse CSV into rows of fields. Handles quoted fields, embedded commas and
// newlines, "" escapes, CRLF, and a leading BOM.
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1); // strip BOM
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } // escaped quote
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else if (c !== "\r") {
      field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  // Drop fully-blank rows (e.g. trailing newline).
  return rows.filter((r) => !(r.length === 1 && r[0].trim() === ""));
}

// CSV -> array of objects, header row as keys. Values stay strings (they get
// substituted into the curl as text anyway).
function csvToObjects(text) {
  const rows = parseCSV(text);
  if (rows.length < 1) return [];
  const headers = rows[0].map((h) => h.trim());
  return rows.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
    return obj;
  });
}

// Small status line next to the variables buttons (filename, item count,
// prettify result). isError tints it red.
function setVarsNote(text, isError) {
  const el = $("fileName");
  el.textContent = text;
  el.style.color = isError ? "var(--err)" : "var(--muted)";
  autoGrow($("vars")); // upload/prettify just changed the box — refit it
  updateRunsVisibility();
}

// The "runs" box only applies to a single data set. If the data box holds an
// array of multiple rows, those rows drive the run count, so hide the box.
function updateRunsVisibility() {
  let multi = false, n = 0;
  try {
    const p = JSON.parse($("vars").value.trim() || "{}");
    if (Array.isArray(p) && p.length > 1) { multi = true; n = p.length; }
  } catch { /* invalid JSON — treat as a single set */ }
  $("runsField").style.display = multi ? "none" : "";
  $("runsNote").textContent = multi ? `${n} runs (one per data row)` : "";
}

// Prettify (and gently repair) the variables box. Reformats valid JSON; if the
// text only parses once wrapped in [ ], wraps it for you; otherwise says so.
$("prettify").addEventListener("click", () => {
  const text = $("vars").value.trim();
  if (!text) { setVarsNote("nothing to format"); return; }
  try {
    const parsed = JSON.parse(text);
    $("vars").value = JSON.stringify(parsed, null, 2);
    setVarsNote(`formatted${Array.isArray(parsed) ? ` · ${parsed.length} items` : ""}`);
    return;
  } catch { /* try the missing-brackets case below */ }
  try {
    const wrapped = JSON.parse(`[${text}]`);
    $("vars").value = JSON.stringify(wrapped, null, 2);
    setVarsNote(`wrapped in [ ] and formatted · ${wrapped.length} items`);
  } catch {
    setVarsNote("✗ invalid JSON — can't format until it's fixed", true);
  }
});

// Load a .json or .csv file into the variables box. JSON is pretty-printed
// (raw on parse failure so the inline error can point at the problem); CSV is
// converted to an array of objects.
$("upload").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    let note = "";
    if (/\.csv$/i.test(file.name)) {
      const objs = csvToObjects(text);
      $("vars").value = JSON.stringify(objs, null, 2);
      note = ` · ${objs.length} items`;
    } else {
      try { $("vars").value = JSON.stringify(JSON.parse(text), null, 2); }
      catch { $("vars").value = text; }
      try { const p = JSON.parse($("vars").value); if (Array.isArray(p)) note = ` · ${p.length} items`; }
      catch { /* leave note empty */ }
    }
    setVarsNote(`${file.name}${note}`);
  };
  reader.readAsText(file);
  e.target.value = ""; // allow re-uploading the same file
});
</script>
</body>
</html>
